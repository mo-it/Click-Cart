# Inventory Service — HARDENED for Assignment 2
# Changes from original:
#   + automountServiceAccountToken: false
#   + allowPrivilegeEscalation: false
#   + capabilities.drop: [ALL]
#   + /tmp emptyDir volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      automountServiceAccountToken: false    # NEW
      containers:
        - name: inventory
          image: inventory:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            runAsNonRoot: true               # KEPT
            runAsUser: 1000                  # KEPT
            readOnlyRootFilesystem: true      # KEPT
            allowPrivilegeEscalation: false   # NEW
            capabilities:
              drop:
                - ALL                         # NEW
          volumeMounts:                       # NEW
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-svc
  labels:
    app: inventory
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 8003
  type: ClusterIP
