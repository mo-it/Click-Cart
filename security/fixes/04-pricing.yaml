# Pricing Service — HARDENED for Assignment 2
# Changes from original:
#   + automountServiceAccountToken: false
#   + allowPrivilegeEscalation: false
#   + capabilities.drop: [ALL]
#   + /tmp emptyDir volume (needed for readOnlyRootFilesystem)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  labels:
    app: pricing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
    spec:
      automountServiceAccountToken: false    # NEW: No K8s API access
      containers:
        - name: pricing
          image: pricing:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            runAsNonRoot: true               # KEPT from original
            runAsUser: 1000                  # KEPT from original
            readOnlyRootFilesystem: true      # KEPT from original
            allowPrivilegeEscalation: false   # NEW
            capabilities:
              drop:
                - ALL                         # NEW
          volumeMounts:                       # NEW: Python needs writable /tmp
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-svc
  labels:
    app: pricing
spec:
  selector:
    app: pricing
  ports:
    - port: 80
      targetPort: 8002
  type: ClusterIP
