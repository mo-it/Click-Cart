# PostgreSQL NetworkPolicy
# The record book — locked in a cage, only the head chef (checkout) has the key
#
# ALLOWS:
#   IN:  Only from checkout on port 5432
#   OUT: Nothing (Postgres doesn't need to call any other service)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: checkout
      ports:
        - port: 5432
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
